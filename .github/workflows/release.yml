name: Release

on:
  push:
    branches: [main]

permissions: {} # start with no permission

env:
  GO_VERSION: "1.26.4"

jobs:
  create-release:
    name: Create Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: flanksource/action-workflows/.github/workflows/create-release.yml@807c141342c97374e637b4375e3a54e62cd8736e

  binary:
    name: Build binaries
    if: needs.create-release.outputs.published == 'true'
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build release assets
        run: make release
        env:
          VERSION: ${{ needs.create-release.outputs.version }}

      - name: Upload binaries to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.create-release.outputs.version }}
        run: gh release upload "$TAG" ./.release/* --clobber --repo "${{ github.repository }}"

  start-binary:
    name: Build deps-start binaries
    if: needs.create-release.outputs.published == 'true'
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build deps-start release assets
        run: make release-start
        env:
          VERSION: ${{ needs.create-release.outputs.version }}

      - name: Upload deps-start binaries to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.create-release.outputs.version }}
        run: gh release upload "$TAG" ./.release/* --clobber --repo "${{ github.repository }}"

  publish-release:
    name: Publish Release
    if: needs.create-release.outputs.published == 'true'
    needs: [create-release, binary, start-binary]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.create-release.outputs.version }}
        run: gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"

  publish-start-module:
    name: Publish start Go module
    if: needs.create-release.outputs.published == 'true'
    needs: [create-release, publish-release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Tag start submodule
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse "v${VERSION}^{commit}")
          tag="start/v${VERSION}"
          refs=$(git ls-remote --tags origin "refs/tags/${tag}^{}" "refs/tags/${tag}")
          existing=$(printf '%s\n' "$refs" | awk -v peeled="refs/tags/${tag}^{}" '$2 == peeled {print $1; found=1} END {}' | head -n1)
          if [ -z "$existing" ]; then
            existing=$(printf '%s\n' "$refs" | awk -v direct="refs/tags/${tag}" '$2 == direct {print $1}' | head -n1)
          fi
          if [ -n "$existing" ]; then
            echo "${tag} already exists at ${existing}"
            [ "$existing" = "$commit" ]
            exit 0
          fi
          git tag "$tag" "$commit"
          git push origin "refs/tags/${tag}"

      - name: Warm Go module proxy
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          url="https://proxy.golang.org/github.com/flanksource/deps/start/@v/v${VERSION}.info"
          for attempt in $(seq 1 12); do
            if curl -fsS "$url"; then
              exit 0
            fi
            echo "proxy not ready (attempt ${attempt}/12), retrying in 30s"
            sleep 30
          done
          echo "Go proxy did not serve ${url}" >&2
          exit 1
