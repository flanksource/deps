name: Release

on:
  push:
    branches: [main]

permissions: {} # start with no permission

env:
  GO_VERSION: "1.26.4"

jobs:
  create-release:
    name: Create Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: flanksource/action-workflows/.github/workflows/create-release.yml@c628197234fd2c4c3aebcb3c2b60dd399251adaf
    secrets:
      token: ${{ secrets.FLANKBOT }}

  binary:
    name: Build binaries
    if: needs.create-release.outputs.published == 'true'
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build release assets
        run: make release
        env:
          VERSION: ${{ needs.create-release.outputs.version }}

      - name: Upload binaries to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.create-release.outputs.version }}
        run: gh release upload "$TAG" ./.release/* --clobber --repo "${{ github.repository }}"

  publish-release:
    name: Publish Release
    if: needs.create-release.outputs.published == 'true'
    needs: [create-release, binary]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.create-release.outputs.version }}
        run: gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
