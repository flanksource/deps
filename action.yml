---
name: "Install Tools and Services with deps"
description: "Automatically install development tools and start local services using deps"
author: "Flanksource"

branding:
  icon: "download"
  color: "blue"

inputs:
  tools:
    description: "List of tools to install (comma-separated or multiline)"
    required: false
    default: ""
  services:
    description: "YAML map of deps-start services and their startup options"
    required: false
    default: ""
  version:
    description: "Version of deps and deps-start to use (e.g., v1.0.39 or latest)"
    required: false
    default: "latest"
  GITHUB_TOKEN:
    description: "GitHub token for accessing the API and avoiding rate limit"
    required: false

outputs:
  tools-installed:
    description: "JSON array of installed tools with versions"
    value: ${{ steps.report.outputs.tools-installed }}
  services-started:
    description: "JSON array of started services and their connections"
    value: ${{ steps.services.outputs.services-started }}

runs:
  using: "composite"
  steps:
    - name: Setup cache paths
      id: cache-paths
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "deps-bin=$HOME/.local/bin" >> $GITHUB_OUTPUT
          echo "deps-cache=$HOME/.deps" >> $GITHUB_OUTPUT
          echo "tools-dir=$HOME/.local/opt" >> $GITHUB_OUTPUT
        else
          echo "deps-bin=$HOME/.local/bin" >> $GITHUB_OUTPUT
          echo "deps-cache=$HOME/.deps" >> $GITHUB_OUTPUT
          echo "tools-dir=$HOME/.local/opt" >> $GITHUB_OUTPUT
        fi

        echo "BIN_DIR=$HOME/.local/bin" >> $GITHUB_ENV
        echo "CACHE_DIR=$HOME/.deps" >> $GITHUB_ENV
        echo "APP_DIR=$HOME/.local/opt" >> $GITHUB_ENV
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Restore deps binary cache
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.cache-paths.outputs.deps-bin }}/deps
          ${{ steps.cache-paths.outputs.deps-bin }}/deps-start
        key: >-
          deps-binary-${{ runner.os }}-${{ runner.arch }}-
          ${{ inputs.version }}

    - name: Restore tools cache
      id: cache-tools
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.cache-paths.outputs.tools-dir }}
          ${{ steps.cache-paths.outputs.deps-cache }}
        key: >-
          deps-tools-${{ runner.os }}-${{ runner.arch }}-
          ${{ hashFiles(inputs.tools) }}

    - name: Install deps binary
      shell: bash
      run: |
        DEPS_BIN="${{ steps.cache-paths.outputs.deps-bin }}"
        mkdir -p "$DEPS_BIN"

        # Skip if cached
        if [ -f "$DEPS_BIN/deps" ]; then
          echo "deps binary found in cache"
          chmod +x "$DEPS_BIN/deps"
        else
          echo "Installing deps binary..."

          # Determine platform and architecture
          OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          if [ "$OS" == "macos" ]; then
            OS="darwin"
          fi

          ARCH="${RUNNER_ARCH}"
          if [ "$ARCH" == "X64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" == "ARM64" ]; then
            ARCH="arm64"
          fi

          VERSION="${{ inputs.version }}"

          # Determine archive extension based on OS
          if [ "$OS" == "windows" ]; then
            ARCHIVE_EXT=".zip"
          else
            ARCHIVE_EXT=".tar.gz"
          fi

          # Build download URL with archive extension
          BASE_URL="https://github.com/flanksource/deps/releases"
          if [ "$VERSION" == "latest" ]; then
            DOWNLOAD_URL="$BASE_URL/latest/download/deps-${OS}-${ARCH}${ARCHIVE_EXT}"
          else
            DOWNLOAD_URL="$BASE_URL/download/${VERSION}/deps-${OS}-${ARCH}${ARCHIVE_EXT}"
          fi

          # Download archive
          ARCHIVE_FILE="$DEPS_BIN/deps-archive${ARCHIVE_EXT}"
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -o "$ARCHIVE_FILE" "$DOWNLOAD_URL"

          # Extract binary from archive
          if [ "$OS" == "windows" ]; then
            unzip -q "$ARCHIVE_FILE" -d "$DEPS_BIN"
          else
            tar -xzf "$ARCHIVE_FILE" -C "$DEPS_BIN"
          fi

          # Clean up archive
          rm -f "$ARCHIVE_FILE"

          # Make executable
          chmod +x "$DEPS_BIN/deps"

          # Verify installation
          if [ ! -f "$DEPS_BIN/deps" ]; then
            echo "Failed to extract deps binary"
            exit 1
          fi
        fi

        # Add to PATH
        echo "$DEPS_BIN" >> $GITHUB_PATH

        # Verify deps works
        "$DEPS_BIN/deps" --help

    - name: Parse and install tools
      id: install
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        TOOLS_INPUT: ${{ inputs.tools }}
      run: |
        # Parse tools (handle both comma-separated and multiline)
        TOOLS_STRING=$(printf '%s\n' "$TOOLS_INPUT" | tr ',' ' ' | tr -d '\r' | tr '\n' ' ' | \
          sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        TOOLS=()
        read -r -a TOOLS < <(printf '%s\n' "$TOOLS_STRING")

        # Install all tools in a single call
        if [ "${#TOOLS[@]}" -gt 0 ]; then
          echo "Installing tools: ${TOOLS[*]}"
          if ! deps install --no-progress "${TOOLS[@]}"; then
            echo "Failed to install tools"
            exit 1
          fi
        fi

    - name: Install deps-start and start services
      id: services
      shell: bash
      env:
        DEPS_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        SERVICES_INPUT: ${{ inputs.services }}
      run: |
        set -euo pipefail

        if [ -z "${SERVICES_INPUT//[[:space:]]/}" ]; then
          echo 'services-started=[]' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "deps-start services are not supported on Windows runners" >&2
          exit 1
        fi

        deps install --no-progress "deps-start@$DEPS_VERSION" yq
        deps-start --version

        ROOT_TYPE=$(printf '%s\n' "$SERVICES_INPUT" | yq -r 'type')
        if [ "$ROOT_TYPE" != "!!map" ]; then
          echo "services must be a YAML map keyed by service name" >&2
          exit 1
        fi

        INVALID_SERVICES=$(printf '%s\n' "$SERVICES_INPUT" | yq -r '
          to_entries | .[] |
          select(.value != null and (.value | type) != "!!map") |
          .key
        ')
        if [ -n "$INVALID_SERVICES" ]; then
          echo "service options must be YAML maps: $INVALID_SERVICES" >&2
          exit 1
        fi

        SERVICES_JSON="["
        SEPARATOR=""
        while IFS= read -r SERVICE_NAME; do
          while IFS= read -r FIELD; do
            case "$FIELD" in
              bind|data_dir|namespace|parameters|port|runtime|update|version|volume_mode|wait_timeout)
                ;;
              *)
                echo "unsupported option for $SERVICE_NAME: $FIELD" >&2
                exit 1
                ;;
            esac
          done < <(printf '%s\n' "$SERVICES_INPUT" | SERVICE_NAME="$SERVICE_NAME" yq -r '
            .[strenv(SERVICE_NAME)] // {} | keys | sort | .[]
          ')

          PARAMETER_TYPE=$(printf '%s\n' "$SERVICES_INPUT" | SERVICE_NAME="$SERVICE_NAME" yq -r '
            (.[strenv(SERVICE_NAME)] // {}).parameters | type
          ')
          case "$PARAMETER_TYPE" in
            "!!map"|"!!null")
              ;;
            *)
              echo "parameters for $SERVICE_NAME must be a YAML map" >&2
              exit 1
              ;;
          esac

          SERVICE_ARGS=("$SERVICE_NAME")
          while IFS= read -r ARG; do
            SERVICE_ARGS+=("$ARG")
          done < <(printf '%s\n' "$SERVICES_INPUT" | SERVICE_NAME="$SERVICE_NAME" yq -r '
            .[strenv(SERVICE_NAME)] // {} |
            (
              to_entries | .[] | select(.key != "parameters") |
              "--" + (.key | sub("_"; "-")) + "=" + (.value | tostring)
            ),
            (
              .parameters // {} | to_entries | .[] |
              "--" + .key + "=" + (.value | tostring)
            )
          ')

          SERVICE_JSON=$(deps-start "${SERVICE_ARGS[@]}" --output=json | yq -I=0 -o=json '.')
          SERVICES_JSON="${SERVICES_JSON}${SEPARATOR}${SERVICE_JSON}"
          SEPARATOR=","
        done < <(printf '%s\n' "$SERVICES_INPUT" | yq -r 'keys | sort | .[]')

        SERVICES_JSON="${SERVICES_JSON}]"
        echo "services-started=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
