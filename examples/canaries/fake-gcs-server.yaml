apiVersion: canaries.flanksource.com/v1
kind: Canary
metadata:
  name: fake-gcs-server
spec:
  schedule: '@every 1m'
  folder:
    - name: canary-object
      path: gcs://deps-canary/ready.txt
      gcpConnection:
        endpoint: '{{ required "fakeGcsURL is required" .fakeGcsURL }}/storage/v1/'
      filter:
        regex: '^ready\.txt$'
      minCount: 1
