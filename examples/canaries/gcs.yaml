apiVersion: canaries.flanksource.com/v1
kind: Canary
metadata:
  name: gcs
spec:
  schedule: '@every 1m'
  folder:
    - name: canary-object
      path: gcs://deps-canary/ready.txt
      gcpConnection:
        endpoint: '{{ required "gcsURL is required" .gcsURL }}/storage/v1/'
      filter:
        regex: '^ready\.txt$'
      minCount: 1
